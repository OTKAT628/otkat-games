plugins {
    id 'com.android.application'
}

android {
    namespace 'com.otkat.games'
    compileSdk 35

    defaultConfig {
        applicationId 'com.otkat.games'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // Initial installable test release. Use a protected persistent upload key
    // for future upgrade-compatible production releases.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
