<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081522"><title>Square Yard — OTKAT Games</title><style>*{box-sizing:border-box}body{margin:0;background:#081522;color:#eaf5ff;font:16px system-ui}main{max-width:900px;margin:auto;padding:20px 14px 50px}.hero,.play{background:#10283b;border:1px solid #35516d;border-radius:18px;padding:18px;margin:12px 0}a{color:#80e4d8;text-decoration:none}.eyebrow{color:#80e4d8;font-size:11px;font-weight:800}h1{font-size:clamp(28px,6vw,42px)}p{line-height:1.55;color:#b9cce0}button{background:#1a3a50;color:#f3fbff;border:1px solid #41647a;border-radius:11px;padding:12px;min-height:48px;font-weight:650}#games,#list{display:none}#board{display:grid;grid-template-columns:repeat(auto-fit,minmax(48px,1fr));gap:8px;margin:14px 0}#controls,#ctrls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.bar{height:7px;background:#1a3549;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:#43c7a6}.download{display:inline-block;margin-top:12px;padding:12px 16px;border:1px solid #80e4d8;border-radius:12px;font-weight:800}</style></head><body><main><section class="hero"><a href="../../index.html">← Каталог игр</a><p class="eyebrow">OTKAT GAMES · MOBILE 100 · КОЛЛЕКЦИЯ 4</p><h1>Square Yard</h1><p>Продолжи ряд квадратов.</p><p>Испытание Pattern: Продолжи ряд квадратов.</p></section><div id="list"></div><section class="play"><h2 id="name">Square Yard</h2><p id="desc">Продолжи ряд квадратов.</p><p id="state">Игра началась</p><div class="bar"><span id="bar"></span></div><div id="board"></div><div id="ctrls"></div><p id="hint">Испытание Pattern: Продолжи ряд квадратов.</p></section><p><a class="download" href="index.html" download="square-yard.html">Скачать эту игру</a></p><p><a href="../../mobile-100-04/index.html">Открыть коллекцию</a></p></main><script>(()=>{'use strict';const G=[{"id":"m1","name":"Odd Parade","type":"Sort","desc":"Собери чётные числа в порядке возрастания.","param":"even"},{"id":"m2","name":"Prime Parade","type":"Sort","desc":"Выбери простые числа по возрастанию.","param":"prime"},{"id":"m3","name":"Reverse River","type":"Sort","desc":"Расположи числа от большего к меньшему.","param":"desc"},{"id":"m4","name":"Tiny Giants","type":"Sort","desc":"Выбери только числа больше пяти.","param":"large"},{"id":"m5","name":"Zero Heroes","type":"Sort","desc":"Найди числа, которые делятся на три.","param":"three"},{"id":"m6","name":"Fox Memory","type":"Memory","desc":"Повтори последовательность из четырёх сигналов.","param":"4"},{"id":"m7","name":"Aurora Recall","type":"Memory","desc":"Повтори шесть цветов в правильном порядке.","param":"6"},{"id":"m8","name":"Drum Code","type":"Memory","desc":"Запомни и повтори пять ритмических знаков.","param":"5"},{"id":"m9","name":"Pixel Echo","type":"Memory","desc":"Повтори семь символов без ошибки.","param":"7"},{"id":"m10","name":"Double Recall","type":"Memory","desc":"Повтори короткий код дважды.","param":"repeat"},{"id":"m11","name":"Northbound","type":"Route","desc":"Пройди маршрут по сторонам света.","param":"N"},{"id":"m12","name":"Zigzag Isle","type":"Route","desc":"Чередуй повороты, не возвращаясь назад.","param":"zig"},{"id":"m13","name":"Corner Quest","type":"Route","desc":"Посети четыре угла поля в заданном порядке.","param":"corners"},{"id":"m14","name":"River Fork","type":"Route","desc":"Выбери верную развилку по подсказкам.","param":"fork"},{"id":"m15","name":"Portal Path","type":"Route","desc":"Найди портал за пять переходов.","param":"portal"},{"id":"m16","name":"Pulse Window","type":"Timing","desc":"Останови счётчик ровно на числе 7.","param":"7"},{"id":"m17","name":"Quiet Second","type":"Timing","desc":"Поймай значение 12 без перелёта.","param":"12"},{"id":"m18","name":"Redline","type":"Timing","desc":"Останови шкалу в узком диапазоне 15–17.","param":"16"},{"id":"m19","name":"Moon Phase","type":"Timing","desc":"Попади на чётное значение между 8 и 14.","param":"even"},{"id":"m20","name":"Final Beat","type":"Timing","desc":"Трижды попади в заданное окно.","param":"triple"},{"id":"m21","name":"Sum Forge","type":"Math","desc":"Собери сумму 20 из двух чисел.","param":"20"},{"id":"m22","name":"Subtraction Bay","type":"Math","desc":"Выбери пару с разностью 4.","param":"4"},{"id":"m23","name":"Multiply Market","type":"Math","desc":"Найди произведение 24.","param":"24"},{"id":"m24","name":"Fraction Fix","type":"Math","desc":"Собери дробную пару с суммой 1.","param":"fraction"},{"id":"m25","name":"Number Bridge","type":"Math","desc":"Соедини три числа в сумму 30.","param":"30"},{"id":"m26","name":"Mimic Hunt","type":"Spot","desc":"Найди единственный отличающийся знак.","param":"shape"},{"id":"m27","name":"Color Scout","type":"Spot","desc":"Найди единственный другой цвет.","param":"color"},{"id":"m28","name":"Tiny Tracker","type":"Spot","desc":"Найди символ, который встречается один раз.","param":"rare"},{"id":"m29","name":"Wild Signal","type":"Spot","desc":"Найди необычную комбинацию эмодзи.","param":"combo"},{"id":"m30","name":"Shadow Mark","type":"Spot","desc":"Найди перевёрнутый символ.","param":"flip"},{"id":"m31","name":"Water Share","type":"Resource","desc":"Распредели 9 единиц воды по трём грядкам: 2,3,4.","param":"2,3,4"},{"id":"m32","name":"Battery Plan","type":"Resource","desc":"Раздай 12 зарядов трём станциям: 5,4,3.","param":"5,4,3"},{"id":"m33","name":"Fuel Convoy","type":"Resource","desc":"Распредели 10 литров: 1,4,5.","param":"1,4,5"},{"id":"m34","name":"Oxygen Crew","type":"Resource","desc":"Распредели 8 баллонов: 3,3,2.","param":"3,3,2"},{"id":"m35","name":"Seed Vault","type":"Resource","desc":"Распредели 15 семян: 5,5,5.","param":"5,5,5"},{"id":"m36","name":"Word Twist","type":"Word","desc":"Собери слово МАЯК из перемешанных букв.","param":"МАЯК"},{"id":"m37","name":"Letter Dock","type":"Word","desc":"Собери слово ПОРТ.","param":"ПОРТ"},{"id":"m38","name":"Forest Code","type":"Word","desc":"Собери слово ЛИСТ.","param":"ЛИСТ"},{"id":"m39","name":"Orbit Word","type":"Word","desc":"Собери слово КОСМОС.","param":"КОСМОС"},{"id":"m40","name":"Winter Note","type":"Word","desc":"Собери слово СНЕГ.","param":"СНЕГ"},{"id":"m41","name":"Next Step","type":"Pattern","desc":"Продолжи арифметическую последовательность.","param":"arith"},{"id":"m42","name":"Twin Peaks","type":"Pattern","desc":"Продолжи удвоение чисел.","param":"double"},{"id":"m43","name":"Square Yard","type":"Pattern","desc":"Продолжи ряд квадратов.","param":"square"},{"id":"m44","name":"Fibo Trail","type":"Pattern","desc":"Продолжи ряд Фибоначчи.","param":"fib"},{"id":"m45","name":"Alternator","type":"Pattern","desc":"Продолжи чередующийся ряд.","param":"alt"},{"id":"m46","name":"Card Forge","type":"Strategy","desc":"Выбери три карты с силой не меньше 18.","param":"18"},{"id":"m47","name":"Shield Wall","type":"Strategy","desc":"Собери защиту ровно 15.","param":"15"},{"id":"m48","name":"Risk Draft","type":"Strategy","desc":"Набери от 13 до 16 очков тремя картами.","param":"14"},{"id":"m49","name":"Treasure Crew","type":"Strategy","desc":"Собери ровно 20 монет тремя картами.","param":"20"},{"id":"m50","name":"Boss Breaker","type":"Strategy","desc":"Победи босса силой 22 за четыре карты.","param":"22"},{"id":"m51","name":"Pendulum Zero","type":"Balance","desc":"Сведи значение к нулю кнопками коррекции.","param":"0"},{"id":"m52","name":"Thermal Control","type":"Balance","desc":"Удержи температуру на 10.","param":"10"},{"id":"m53","name":"Tide Gauge","type":"Balance","desc":"Настрой уровень прилива на 14.","param":"14"},{"id":"m54","name":"Gyro Lab","type":"Balance","desc":"Стабилизируй гироскоп на 5.","param":"5"},{"id":"m55","name":"Gravity Trim","type":"Balance","desc":"Настрой гравитацию на 18.","param":"18"},{"id":"m56","name":"Locksmith Junior","type":"Code","desc":"Введи код 314 по подсказкам.","param":"314"},{"id":"m57","name":"Beacon Keeper","type":"Code","desc":"Восстанови код маяка 527.","param":"527"},{"id":"m58","name":"Signal Vault","type":"Code","desc":"Открой передатчик комбинацией 806.","param":"806"},{"id":"m59","name":"Deep Archive","type":"Code","desc":"Введи архивный код 193.","param":"193"},{"id":"m60","name":"Last Frequency","type":"Code","desc":"Найди частоту 462.","param":"462"}];const $=x=>document.getElementById(x),B=$('board'),C=$('ctrls');let g,s={};function say(t){$('state').textContent=t}function bar(n){$('bar').style.width=Math.max(0,Math.min(100,n))+'%'}function btn(t,f){let x=document.createElement('button');x.className='ctrl100';x.textContent=t;x.onclick=f;C.append(x)}function tile(t,f){let x=document.createElement('button');x.className='tile100';x.textContent=t;x.onclick=f;B.append(x)}function done(t){s.done=true;let k='otkat-m100-'+g.id,old=+(localStorage.getItem(k)||0);localStorage.setItem(k,String(old+1));say(t+' Рекордов: '+(old+1));bar(100)}function start(id){g=G.find(x=>x.id===id);s={};B.innerHTML='';C.innerHTML='';$('name').textContent=g.name;$('desc').textContent=g.desc;$('hint').textContent='Рекорд сохраняется на этом устройстве.';bar(0);say('Раунд начался');run()}function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function run(){let t=g.type,p=g.param;
if(t==='Sort'){let a=p==='even'?[8,3,4,9,2,7]:p==='prime'?[9,7,4,11,6,3]:p==='desc'?[2,9,4,8,1,6]:p==='large'?[2,8,4,9,3,7]:[8,6,4,5,9,3];s.target=p==='even'?[2,4,8]:p==='prime'?[3,7,11]:p==='desc'?[9,8,6,4,2,1]:p==='large'?[7,8,9]:[3,6,9];s.picked=[];shuffle(a).forEach(v=>tile(v,()=>{if(s.picked.includes(v))return;s.picked.push(v);say('Выбрано: '+s.picked.join(', '));bar(s.picked.length/s.target.length*100);if(s.picked.length===s.target.length){if(s.picked.join(',')===s.target.join(','))done('Отличная сортировка!');else say('Порядок или выбор неверен. Начни заново.')}}));}
if(t==='Memory'){let n=p==='repeat'?4:+p;let seq=Array.from({length:n},()=>Math.floor(Math.random()*4));s.seq=seq;s.pos=0;s.input=[];say('Запомни код: '+seq.map(x=>'●◆▲■'[x]).join(' '));btn('Показать код ещё раз',()=>say('Код: '+seq.map(x=>'●◆▲■'[x]).join(' ')));['●','◆','▲','■'].forEach((v,i)=>tile(v,()=>{s.input.push(i);if(s.input[s.input.length-1]!==seq[s.input.length-1]){say('Ошибка. Нажми «Начать заново»');return}bar(s.input.length/n*100);if(s.input.length===n)done('Последовательность повторена!')}));btn('Начать заново',()=>start(g.id))}
if(t==='Route'){let seq=p==='N'?['↑','↑','→','↓','→']:p==='zig'?['↑','→','↑','→','↑']:p==='corners'?['↖','↗','↘','↙']:p==='fork'?['←','→','→','←']:['→','↑','↑','→','↓'];s.seq=seq;s.i=0;seq.forEach((v,i)=>tile(['↑','→','↓','←','↖','↗','↘','↙'][i%8],()=>{if(v===seq[s.i]){s.i++;bar(s.i/seq.length*100);say('Маршрут: '+s.i+'/'+seq.length);if(s.i===seq.length)done('Путь найден!')}else say('Тупик. Начни маршрут заново.')}));say('Маршрут: '+seq.join(' '))}
if(t==='Timing'){s.v=0;s.target=p==='even'?12:p==='triple'?9:+p;s.hits=0;btn('Тик +1',()=>{s.v++;say('Счётчик: '+s.v);if(s.v>20)s.v=0});btn('Зафиксировать',()=>{let ok=p==='even'?s.v>=8&&s.v<=14&&s.v%2===0:p==='triple'?s.v>=8&&s.v<=10:s.v===s.target||p==='16'&&s.v>=15&&s.v<=17;if(ok){s.hits++;s.v=0;say('Попадание '+s.hits+(p==='triple'?'/3':'/1'));if(s.hits>=(p==='triple'?3:1))done('Идеальный тайминг!')}else say('Мимо. Сбрось счётчик и попробуй снова.')} );}
if(t==='Math'){if(p==='fraction'){['1/2 + 1/2','1/3 + 1/3','1/4 + 1/2','1/5 + 1/5'].forEach((v,i)=>tile(v,()=>i===0?done('Дроби сложены верно!'):say('Сумма не равна единице.')))}else{let opts=p==='20'?[8,12,9,11]:p==='4'?[9,5,8,3]:p==='24'?[6,4,7,8]:[10,12,8,9];s.chosen=[];let need=p==='30'?3:2;opts.forEach(v=>tile(v,()=>{if(s.chosen.length>=need||s.chosen.includes(v))return;s.chosen.push(v);say('Выбрано: '+s.chosen.join(' + '));if(s.chosen.length===need){let vals=s.chosen,ok=p==='20'?vals.reduce((a,b)=>a+b,0)===20:p==='4'?Math.abs(vals[0]-vals[1])===4:p==='24'?vals[0]*vals[1]===24:vals.reduce((a,b)=>a+b,0)===30;if(ok)done('Математическая задача решена!');else say('Комбинация не подходит. Начни заново.')}}));btn('Сбросить выбор',()=>start(g.id))}}
if(t==='Spot'){let icons=p==='shape'?['●','●','●','◆','●','●']:p==='color'?['🟦','🟦','🟦','🟥','🟦','🟦']:p==='rare'?['★','◆','★','★','★','★']:p==='combo'?['🌙','🌙','🌙','🌞','🌙','🌙']:['↑','↑','↑','↓','↑','↑'];let odd=icons.findIndex((v,i)=>icons.indexOf(v)===i&&icons.lastIndexOf(v)===i);icons.forEach((v,i)=>tile(v,()=>i===odd?done('Отличие найдено!'):say('Не тот символ — попробуй снова.')))}
if(t==='Resource'){let target=p.split(',').map(Number);s.val=[0,0,0];s.total=target.reduce((a,b)=>a+b,0);target.forEach((v,i)=>{tile('Сектор '+(i+1)+' · '+v,()=>{if(s.total<=0)return;s.val[i]++;s.total--;say('Распределено: '+s.val.join('/')+' · осталось '+s.total);if(s.total===0){if(s.val.every((x,j)=>x===target[j]))done('Ресурсы распределены!');else say('Распределение не совпало. Начни заново.')}})});say('Нужно распределить '+s.total+' единиц между секторами. Нажимай на сектор нужное число раз.')}
if(t==='Word'){let word=p,arr=shuffle([...word]);s.word=word;s.input='';arr.forEach(ch=>tile(ch,()=>{s.input+=ch;say('Слово: '+s.input);bar(s.input.length/word.length*100);if(s.input.length===word.length){if(s.input===word)done('Слово собрано!');else say('Буквы не в том порядке. Сбрось ввод.')}}));btn('Сбросить',()=>start(g.id))}
if(t==='Pattern'){let seq=p==='arith'?[2,4,6,8]:p==='double'?[1,2,4,8]:p==='square'?[1,4,9,16]:p==='fib'?[1,1,2,3]:[1,3,1,3];let answer=p==='arith'?10:p==='double'?16:p==='square'?25:p==='fib'?5:1; s.seq=seq; say('Продолжи: '+seq.join(', ')+' …');[answer,answer+1,answer+2,answer*2].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>tile(v,()=>v===answer?done('Последовательность продолжена!'):say('Это не следующий элемент.')))}
if(t==='Strategy'){let target=+p,arr=[3,5,7,8,9,10,11];s.sum=0;s.n=0;shuffle(arr).forEach(v=>tile('Карта '+v,()=>{if(s.n>= (p==='22'?4:3))return;s.sum+=v;s.n++;say('Сила '+s.sum+' · карты '+s.n);bar(s.n/(p==='22'?4:3)*100);if(s.n===(p==='22'?4:3)){if(p==='14'?s.sum>=13&&s.sum<=16:s.sum>=target)done('Отряд готов!');else say('Силы не хватило или перебор. Начни заново.')}}))}
if(t==='Balance'){let target=+p;s.v=0;btn('−1',()=>{s.v--;say('Значение: '+s.v)});btn('+1',()=>{s.v++;say('Значение: '+s.v)});btn('Проверить',()=>s.v===target?done('Система стабилизирована!'):say('Пока не цель. Сейчас '+s.v));say('Настрой показатель на '+target)}
if(t==='Code'){s.code=p;s.input='';for(let n=0;n<10;n++)tile(n,()=>{if(s.input.length<3)s.input+=n;say('Код: '+s.input.padEnd(3,'_'))});btn('Очистить',()=>{s.input='';say('Ввод очищен')});btn('Открыть',()=>s.input===s.code?done('Замок открыт!'):say('Неверный код. Попробуй снова.'))}
}
$('list').innerHTML='';G.forEach(x=>{let b=document.createElement('button');b.textContent=x.name;b.onclick=()=>start(x.id);$('list').append(b)});start("m43");
})();</script></body></html>
