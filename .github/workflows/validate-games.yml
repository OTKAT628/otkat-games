name: Validate new game lineup

on:
  push:
    branches: [feature/godot-mobile100-consolidation]
    paths:
      - "web/**"
      - ".github/workflows/validate-games.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/validate-games.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          find web -name '*.js' -type f -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Check standalone product catalogues
        run: |
          test -s web/games/index.html
          test -s web/apps/index.html
          test -s web/downloads/index.html
          for slug in party-circuit mindforge wild-frontier; do
            test -s "web/games/$slug/index.html"
            grep -q 'ОПИСАНИЕ И УСТАНОВКА' web/games/index.html
          done
          grep -q 'OTKAT Party Circuit' web/games/index.html
          grep -q 'OTKAT Mindforge' web/games/index.html
          grep -q 'OTKAT Wild Frontier' web/games/index.html
          ! grep -qi 'Mobile 100\|105 игр\|мини-игр' web/apps/index.html
          ! grep -qi 'Mobile 100\|105 игр' web/downloads/index.html
          grep -q 'OTKAT Stream' web/apps/index.html
          grep -q 'OTKAT Library' web/apps/index.html
          grep -q 'OTKAT Games' web/games/index.html
