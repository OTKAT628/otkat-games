name: Build OTKAT Games Android APK

on:
  push:
    branches: [feature/android-apk-windows-exe, feature/15-new-app-games]
    paths: ["web/**", "android/**", ".github/workflows/build-android-apk.yml"]
  pull_request:
    branches: [main, feature/15-new-app-games]
    paths: ["web/**", "android/**", ".github/workflows/build-android-apk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Bundle web games into Android assets
        run: |
          mkdir -p android/app/src/main/assets/site
          cp -R web/. android/app/src/main/assets/site/
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: otkat-games-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
