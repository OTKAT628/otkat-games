name: Build and smoke-test OTKAT Games Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk release/OTKAT-Games-Android-v1.0.0.apk
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: |
            adb install release/OTKAT-Games-Android-v1.0.0.apk
            adb shell am start -n com.otkat.games/.MainActivity
            sleep 25
            adb shell pidof com.otkat.games
            adb logcat -d -t 6000 > /tmp/otkat-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\\.otkat\\.games" /tmp/otkat-logcat.txt; then
              echo "Application crash detected"
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "com.otkat.games/.MainActivity"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTKAT-Games-Android-v1.0.0
          path: release/OTKAT-Games-Android-v1.0.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.0
          name: OTKAT Games Android v1.0.0
          body: |
            First Android launcher for the OTKAT Games catalog.

            Includes access to all 15 browser games through the official catalog.
            Requires an internet connection. This is a WebView wrapper; games remain browser-based experiences.
            Smoke-tested by installing and launching on an Android 15 emulator in CI.
          files: release/OTKAT-Games-Android-v1.0.0.apk
          make_latest: true
