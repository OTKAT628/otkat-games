name: Build and smoke-test OTKAT Games Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-games.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
        working-directory: android
      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/OTKAT-Games-Android-v1.1.0.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: OTKAT-Games-Android-v1.1.0
          path: release/OTKAT-Games-Android-v1.1.0.apk
          if-no-files-found: error
          retention-days: 90
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install release/OTKAT-Games-Android-v1.1.0.apk
            adb shell am start -n com.otkat.games/.MainActivity
            sleep 25
            adb shell pidof com.otkat.games
            adb logcat -d -t 6000 > /tmp/otkat-logcat.txt
            if grep -E "FATAL EXCEPTION|Process: com\\.otkat\\.games" /tmp/otkat-logcat.txt; then
              echo "Application crash detected"
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F "com.otkat.games/.MainActivity"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.1.0
          name: OTKAT Games Android v1.1.0
          body: |
            Android launcher for the expanded OTKAT Games catalog.

            Includes access to the 15 standalone browser games and 90 Mobile 100 mini-game challenges through the official applications catalog.
            Requires an internet connection; the games are web experiences hosted by OTKAT Games, not separate native APKs. This is a WebView wrapper; games remain browser-based experiences.
            Touch controls are injected for 3D prototypes.
            Smoke-tested by installing and launching on an Android 15 emulator in CI.
          files: release/OTKAT-Games-Android-v1.1.0.apk
          make_latest: true
