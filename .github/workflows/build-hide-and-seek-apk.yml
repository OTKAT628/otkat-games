name: Build Hide & Seek Android APK

on:
  push:
    branches:
      - feature/hide-and-seek-3d
    paths:
      - "web/hide-and-seek/3d.html"
      - "apps/hide-and-seek-android/**"
      - ".github/workflows/build-hide-and-seek-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/hide-and-seek-android/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        working-directory: apps/hide-and-seek-android
        run: npm install

      - name: Prepare web entry point
        working-directory: apps/hide-and-seek-android
        run: |
          mkdir -p www
          cp ../../web/hide-and-seek/3d.html www/index.html

      - name: Generate Android project
        working-directory: apps/hide-and-seek-android
        run: npx cap add android

      - name: Sync web assets
        working-directory: apps/hide-and-seek-android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: apps/hide-and-seek-android/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OTKAT-Hide-and-Seek-Android-debug
          path: apps/hide-and-seek-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
