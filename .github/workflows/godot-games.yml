name: Validate Godot native game projects

on:
  pull_request:
    branches: [main]
    paths:
      - "games-godot/**"
      - ".github/workflows/godot-games.yml"
  push:
    branches: [feature/godot-mobile100-consolidation]
    paths:
      - "games-godot/**"
      - ".github/workflows/godot-games.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: true
          include-templates: false
      - name: Build all C# game projects
        run: |
          set -euo pipefail
          dotnet build games-godot/party-circuit/OTKAT.PartyCircuit.csproj --configuration Release
          dotnet build games-godot/mindforge/OTKAT.Mindforge.csproj --configuration Release
          dotnet build games-godot/wild-frontier/OTKAT.WildFrontier.csproj --configuration Release
      - name: Validate Godot project imports
        shell: bash
        run: |
          set -euo pipefail
          for project in party-circuit mindforge wild-frontier; do
            godot --headless --editor --path "games-godot/$project" --quit
          done
