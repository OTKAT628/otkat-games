name: Validate OTKAT mobile game collections

on:
  pull_request:
    branches: [main]
    paths:
      - "web/apps/**"
      - "web/sw.js"
      - ".github/workflows/validate-app-games.yml"
  push:
    branches: [feature/15-new-app-games]
    paths:
      - "web/apps/**"
      - "web/sw.js"
      - ".github/workflows/validate-app-games.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: |
          node --check web/apps/app-games.js
          node --check web/apps/mobile-100/mobile-100.js\n          node --check web/apps/mobile-100-02/mobile-100-02.js
      - name: Verify all 15 pages
        run: |
          for slug in clockwork-courier lumen-garden cargo-zero mine-signal signal-siege pulse-runner inkbound deep-current rift-cartographer marble-foundry kitchen-sprint orbit-weaver skyhook frostline hex-frontier; do
            test -s "web/apps/$slug/index.html"
            grep -q "data-app-game=\"$slug\"" "web/apps/$slug/index.html"
            grep -q 'src="../app-games.js"' "web/apps/$slug/index.html"
          done
          test -s web/apps/app-games.js
          grep -q "clockwork-courier" web/apps/app-games.js
          grep -q "hex-frontier" web/apps/app-games.js
          test -s web/apps/mobile-100/index.html
          grep -q 'mobile-100.js' web/apps/mobile-100/index.html
          grep -q 'Echo Sequence' web/apps/mobile-100/mobile-100.js\n          test -s web/apps/mobile-100-02/index.html\n          grep -q 'mobile-100-02.js' web/apps/mobile-100-02/index.html\n          grep -q 'Pendulum Balance' web/apps/mobile-100-02/mobile-100-02.js
